name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Thin caller for the canonical reusable release pipeline. The build →
# semantic-release → Docker → MCP Registry → security chain (tag-based release
# detection + correct gating) lives in WYRE-AI/.github so every *-mcp
# repo stays in lockstep instead of drifting per-repo. Caller jobs grant the
# token scopes the reusable jobs request (a reusable can only reduce, never
# expand, caller-granted scope).
jobs:
  release:
    permissions:
      contents: write
      issues: write
      pull-requests: write  # @semantic-release/github success step reads/comments on PRs
      packages: write
      id-token: write
      security-events: write
    uses: WYRE-AI/.github/.github/workflows/mcp-server-release.yml@07bc1921cbd01ad8a079fe8a3dd28180080870d5
    with:
      server-name: connectwise-cpq-mcp
      image-name: ghcr.io/wyre-ai/connectwise-cpq-mcp
    secrets: inherit

# NO `deploy:` job — deliberate. ConnectWise CPQ is a CONDUIT-ONLY vendor.
#
# The fleet-standard `mcp-server-deploy.yml` deploys to `gwp-<slug>` in the
# `mcp-gateway-prod` resource group — the separate, still-live legacy fleet
# (53 apps as of 2026-08-04), NOT conduit. Conduit's sidecars are deployed
# from `azure/vendor-fleet.conduit-prod.bicepparam` by conduit's own
# `deploy-vendor-fleet.yml`, where connectwise-cpq is digest-pinned and
# running. Nothing in this repo deploys conduit, so the job had nothing to do
# here: with no `gwp-connectwise-cpq` Container App it could only ever fail.
#
# It did, on the v1.0.0 release: `AADSTS7002131` (no Azure federated identity
# credential exists for `repo:wyre-technology/connectwise-cpq-mcp:environment:
# production`). Registering that credential would not have helped — the target
# ACA does not exist either, so `az containerapp update` would fail next.
#
# This matches the other conduit-only vendors: scalepad-mcp and clio-mcp both
# call `mcp-server-release.yml` with no deploy job.
#
# If CPQ is ever wanted on the legacy gateway too, all three are required:
#   1. az ad app federated-credential create for this repo's production subject
#   2. create the `gwp-connectwise-cpq` ACA in `mcp-gateway-prod`
#   3. register the vendor in the `mcp-gateway` repo
# then restore this job.
