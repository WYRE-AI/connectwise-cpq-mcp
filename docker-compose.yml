services:
  # Gateway mode. CPQ keys arrive per request on X-CPQ-* headers.
  # Do not set CPQ_ACCESS_KEY, CPQ_PUBLIC_KEY, CPQ_PRIVATE_KEY, or env_file
  # here — that would put static vendor credentials in the container. The
  # project .env is used only for Compose interpolation of CONDUIT_S2S_SECRET.
  # For AUTH_MODE=env, pass the CPQ_* variables on that process instead
  # (see the README).
  connectwise-cpq-mcp:
    build:
      context: .
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=8080
      - MCP_HTTP_HOST=0.0.0.0
      - AUTH_MODE=gateway
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
